
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON ESCAPE | EmilionStudios</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080817;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: #00f7ff;
    text-shadow: 0 0 15px #00f7ff;
    margin-top: 20px;
}

#game {
    width: 330px;
    height: 470px;
    margin: 20px auto;
    position: relative;
    overflow: hidden;
    background: linear-gradient(#10102b, #171735);
    border: 3px solid #00f7ff;
    border-radius: 15px;
    box-shadow: 0 0 20px #00f7ff;
}

.lane {
    position: absolute;
    top: 0;
    height: 100%;
    width: 33.33%;
    border-right: 2px dashed #34346b;
}

.lane:nth-child(1) { left: 0; }
.lane:nth-child(2) { left: 33.33%; }
.lane:nth-child(3) { left: 66.66%; border: none; }

.player, .obstacle, .coin {
    position: absolute;
    width: 55px;
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    border-radius: 12px;
}

.player {
    bottom: 25px;
    background: #00d9ff;
    box-shadow: 0 0 18px #00d9ff;
    transition: left 0.12s;
}

.obstacle {
    top: 45px;
    background: #ff245c;
    box-shadow: 0 0 18px #ff245c;
}

.coin {
    top: 155px;
    background: #ffd500;
    box-shadow: 0 0 18px #ffd500;
    border-radius: 50%;
}

#score {
    font-size: 22px;
    color: #ffe600;
    margin: 10px;
}

button {
    background: #00d9ff;
    color: #080817;
    border: none;
    border-radius: 10px;
    padding: 12px 22px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin: 6px;
}

button:hover {
    background: #72f4ff;
}

#message {
    font-size: 30px;
    font-weight: bold;
    color: #ff245c;
    text-shadow: 0 0 15px #ff245c;
    margin: 12px;
    min-height: 36px;
}

#records {
    margin: 20px auto;
    width: 320px;
    background: #15152d;
    border: 1px solid #00d9ff;
    border-radius: 12px;
    padding: 12px;
}

#records h2 {
    color: #00f7ff;
}

table {
    width: 100%;
    border-collapse: collapse;
}

td, th {
    padding: 8px;
    border-bottom: 1px solid #34346b;
}

#nameBox {
    display: none;
    margin: 15px auto;
}

input {
    padding: 10px;
    border-radius: 8px;
    border: 2px solid #00d9ff;
    background: #10102b;
    color: white;
    width: 160px;
    font-size: 16px;
}
</style>
</head>

<body>

<h1>🚀 NEON ESCAPE</h1>
<div id="score">Puntos: 0</div>

<div id="game">
    <div class="lane"></div>
    <div class="lane"></div>
    <div class="lane"></div>

    <div id="player" class="player">🚀</div>
    <div id="obstacle" class="obstacle">💥</div>
    <div id="coin" class="coin">🪙</div>
</div>

<div id="message">¡Prepárate!</div>

<button onclick="startGame()">JUGAR</button>
<button onclick="move(-1)">⬅️</button>
<button onclick="move(1)">➡️</button>

<div id="nameBox">
    <p>¡Escribe tu nombre para guardar tu récord!</p>
    <input id="playerName" maxlength="10" placeholder="Tu nombre">
    <button onclick="saveRecord()">GUARDAR</button>
</div>

<div id="records">
    <h2>🏆 MEJORES 5</h2>
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Puntos</th>
            </tr>
        </thead>
        <tbody id="recordList"></tbody>
    </table>
</div>

<script>
const player = document.getElementById("player");
const obstacle = document.getElementById("obstacle");
const coin = document.getElementById("coin");
const scoreText = document.getElementById("score");
const message = document.getElementById("message");
const nameBox = document.getElementById("nameBox");

let lane = 1;
let obstacleLane = 0;
let coinLane = 2;
let score = 0;
let playing = false;
let gameLoop;
let gameOverTimer;
let ending = false;

const positions = [27, 137, 247];

function draw() {
    player.style.left = positions[lane] + "px";
    obstacle.style.left = positions[obstacleLane] + "px";
    coin.style.left = positions[coinLane] + "px";
}

// Récords guardados
function getRecords() {
    const records = JSON.parse(
        localStorage.getItem("emilionstudios_neon_records") || "[]"
    );

    const others = records.filter(
        record => record.name !== "Emilio Nuñez"
    );

    return [
        { name: "Emilio Nuñez", score: 50000000 },
        ...others
    ]
    .sort((a, b) => b.score - a.score)
    .slice(0, 5);
}

function storeRecords(records) {
    localStorage.setItem(
        "emilionstudios_neon_records",
        JSON.stringify(records)
    );
}

function renderRecords() {
    const records = getRecords();
    const list = document.getElementById("recordList");

    list.innerHTML = "";

    records.forEach((record, index) => {
        const row = document.createElement("tr");

        const nameCell = document.createElement("td");
        const scoreCell = document.createElement("td");

        nameCell.textContent =
            (index === 0 ? "👑 " : "") + record.name;

        scoreCell.textContent = record.score.toLocaleString("en-US");

        row.appendChild(nameCell);
        row.appendChild(scoreCell);
        list.appendChild(row);
    });

    storeRecords(records);
}

function move(direction) {
    if (!playing || ending) return;

    lane += direction;

    if (lane < 0) lane = 0;
    if (lane > 2) lane = 2;

    draw();

    if (lane === obstacleLane) {
        endGame();
    }
}

// Controles del teclado
document.addEventListener("keydown", function(event) {
    if (event.key === "ArrowLeft") {
        event.preventDefault();
        move(-1);
    }

    if (event.key === "ArrowRight") {
        event.preventDefault();
        move(1);
    }
});

function startGame() {
    clearInterval(gameLoop);
    clearTimeout(gameOverTimer);

    lane = 1;
    obstacleLane = Math.floor(Math.random() * 3);
    coinLane = Math.floor(Math.random() * 3);

    score = 0;
    playing = true;
    ending = false;

    nameBox.style.display = "none";
    message.textContent = "¡Corre!";
    scoreText.textContent = "Puntos: 0";

    draw();

    gameLoop = setInterval(step, 700);
}

function step() {
    if (!playing || ending) return;

    if (lane === coinLane) {
        score += 10;
        coinLane = Math.floor(Math.random() * 3);
    } else {
        score += 1;
    }

    obstacleLane = Math.floor(Math.random() * 3);

    scoreText.textContent = "Puntos: " + score;
    draw();

    if (lane === obstacleLane) {
        endGame();
    }
}

// Game Over después de 1.5 segundos
function endGame() {
    if (ending || !playing) return;

    ending = true;
    playing = false;

    clearInterval(gameLoop);

    message.textContent = "💥 ¡CHOQUE!";

    gameOverTimer = setTimeout(() => {
        message.textContent = "GAME OVER";
        nameBox.style.display = "block";
        document.getElementById("playerName").focus();
    }, 1500);
}

// Guardar récords sin permitir superar a Emilio
function saveRecord() {
    const nameInput = document.getElementById("playerName");
    const name = nameInput.value.trim().slice(0, 10);

    if (!name) {
        nameInput.focus();
        return;
    }

    if (name.toLowerCase() === "emilio nuñez".toLowerCase()) {
        message.textContent = "Ese puesto ya tiene dueño 😎";
        return;
    }

    const records = getRecords();

    records.push({
        name: name,
        score: Math.min(score, 49999999)
    });

    records.sort((a, b) => b.score - a.score);

    const topFive = [
        { name: "Emilio Nuñez", score: 50000000 },
        ...records.filter(record => record.name !== "Emilio Nuñez")
    ]
    .sort((a, b) => b.score - a.score)
    .slice(0, 5);

    storeRecords(topFive);
    renderRecords();

    nameBox.style.display = "none";
    message.textContent = "🏆 ¡BUEN JUEGO!";

    nameInput.value = "";
}

// Mostrar tabla al abrir el juego
renderRecords();
draw();
</script>

</body>
</html>
