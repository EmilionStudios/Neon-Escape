
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON ESCAPE | EmilionStudios</title>

<style>
* {
  box-sizing: border-box;
}

body {
  background: radial-gradient(circle, #18244b, #080b19);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px;
}

h1 {
  color: #00eaff;
  font-size: 38px;
  text-shadow: 0 0 15px #00eaff;
}

h3 {
  color: #a8b8e8;
}

.panel {
  max-width: 450px;
  margin: 15px auto;
  padding: 15px;
  background: #111c38;
  border: 1px solid #00bfff;
  border-radius: 15px;
}

#game {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 25px auto;
}

.lane {
  width: 100px;
  height: 320px;
  background: #182342;
  border: 2px solid #00bfff;
  border-radius: 12px;
  position: relative;
  font-size: 35px;
}

.item {
  position: absolute;
  top: 45px;
  left: 30px;
}

.ship {
  position: absolute;
  bottom: 15px;
  left: 30px;
}

button {
  background: #007eae;
  color: white;
  border: none;
  padding: 13px 18px;
  border-radius: 10px;
  margin: 5px;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #00bfff;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

#message {
  color: #00eaff;
  font-weight: bold;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
}

th, td {
  padding: 10px 5px;
  border-bottom: 1px solid #34466d;
}

th {
  color: #00eaff;
}

td {
  color: white;
}

#recordModal {
  display: none;
  position: fixed;
  inset: 0;
  background: #000c;
  z-index: 10;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modalContent {
  width: 100%;
  max-width: 350px;
  background: #111c38;
  border: 2px solid #00eaff;
  border-radius: 18px;
  padding: 25px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 12px 0;
  border-radius: 8px;
  border: 2px solid #00bfff;
  background: #080b19;
  color: white;
  font-size: 18px;
  text-align: center;
}

footer {
  color: #8da5d5;
  margin-top: 30px;
  font-size: 13px;
}
</style>
</head>

<body>

<h1>🚀 NEON ESCAPE</h1>
<h3>EMILIONSTUDIOS</h3>

<div class="panel">
  <h2>🏆 Puntos: <span id="score">0</span></h2>
</div>

<div id="game">
  <div class="lane" id="l0"></div>
  <div class="lane" id="l1"></div>
  <div class="lane" id="l2"></div>
</div>

<button onclick="move(-1)">⬅️ IZQUIERDA</button>
<button onclick="start()" id="startButton">▶ JUGAR</button>
<button onclick="move(1)">DERECHA ➡️</button>

<p id="message">¡Pulsa JUGAR para comenzar!</p>
<p>Controles: ⬅️ ➡️ Flechas del teclado</p>

<!-- TABLA DE RÉCORDS -->
<div class="panel">
  <h2>🏆 TOP 5 RÉCORDS</h2>

  <table>
    <thead>
      <tr>
        <th>Posición</th>
        <th>Jugador</th>
        <th>Puntos</th>
      </tr>
    </thead>
    <tbody id="recordsTable"></tbody>
  </table>
</div>

<!-- VENTANA PARA GUARDAR EL RÉCORD -->
<div id="recordModal">
  <div class="modalContent">
    <h2>💥 ¡GAME OVER!</h2>
    <h3>Tu puntuación: <span id="finalScore">0</span></h3>

    <p>¡Escribe tu nombre para guardar tu récord!</p>

    <input
      type="text"
      id="playerName"
      maxlength="10"
      placeholder="Tu nombre"
      autocomplete="off"
    >

    <button onclick="saveRecord()">💾 GUARDAR RÉCORD</button>
  </div>
</div>

<footer>
  Creado por Emilio Nuñez · EmilionStudios · 2026
</footer>

<script>

// CONFIGURACIÓN
let player = 1;
let obstacle = 0;
let coin = 2;
let score = 0;
let playing = false;
let timer = null;

// CLAVE DE LOCALSTORAGE
const STORAGE_KEY = "emilionstudios_neon_records";

// CARGAR RÉCORDS
function getRecords() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return Array.isArray(saved) ? saved : [];
  } catch (error) {
    return [];
  }
}

// GUARDAR RÉCORDS
function storeRecords(records) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    return true;
  } catch (error) {
    alert("No se pudieron guardar los récords en este navegador.");
    return false;
  }
}

// MOSTRAR TABLA
function renderRecords() {
  const table = document.getElementById("recordsTable");
  table.innerHTML = "";

  const records = getRecords()
    .filter(r =>
      r &&
      typeof r.name === "string" &&
      Number.isFinite(r.score)
    )
    .sort((a, b) => b.score - a.score)
    .slice(0, 5);

  if (records.length === 0) {
    table.innerHTML =
      '<tr><td colspan="3">Todavía no hay récords. ¡Sé el primero!</td></tr>';
    return;
  }

  records.forEach((record, index) => {
    const row = document.createElement("tr");

    const position = document.createElement("td");
    const name = document.createElement("td");
    const points = document.createElement("td");

    position.textContent = ["🥇", "🥈", "🥉", "4", "5"][index];
    name.textContent = record.name;
    points.textContent = record.score;

    row.append(position, name, points);
    table.appendChild(row);
  });
}

// DIBUJAR JUEGO
function draw() {
  for (let i = 0; i < 3; i++) {
    const lane = document.getElementById("l" + i);
    lane.innerHTML = "";

    if (i === obstacle) {
      lane.innerHTML += '<div class="item">🔺</div>';
    }

    if (i === coin) {
      lane.innerHTML +=
        '<div class="item" style="top:120px">🪙</div>';
    }

    if (i === player) {
      lane.innerHTML += '<div class="ship">🚀</div>';
    }
  }

  document.getElementById("score").textContent = score;
}

// MOVER JUGADOR
function move(direction) {
  if (!playing) return;

  player = Math.max(0, Math.min(2, player + direction));

  if (player === obstacle) {
    gameOver();
    return;
  }

  draw();
}

// CONTROLES DEL TECLADO
document.addEventListener("keydown", function(event) {
  if (event.key === "ArrowLeft") {
    event.preventDefault();
    move(-1);
  }

  if (event.key === "ArrowRight") {
    event.preventDefault();
    move(1);
  }
});

// MOVIMIENTO DEL JUEGO
function step() {
  if (player === coin) {
    score += 10;
  } else {
    score += 1;
  }

  obstacle = Math.floor(Math.random() * 3);
  coin = Math.floor(Math.random() * 3);

  draw();

  if (player === obstacle) {
    gameOver();
  }
}

// INICIAR
function start() {
  clearInterval(timer);

  document.getElementById("recordModal").style.display = "none";

  player = 1;
  obstacle = 0;
  coin = 2;
  score = 0;
  playing = true;

  document.getElementById("message").textContent =
    "¡A jugar! Esquiva los obstáculos.";

  document.getElementById("startButton").textContent = "↻ REINICIAR";

  draw();

  timer = setInterval(step, 850);
}

// PERDER
function gameOver() {
  playing = false;
  clearInterval(timer);

  document.getElementById("message").textContent =
    "💥 ¡GAME OVER!";

  document.getElementById("finalScore").textContent = score;
  document.getElementById("playerName").value = "";

  document.getElementById("recordModal").style.display = "flex";

  document.getElementById("playerName").focus();
}

// GUARDAR NUEVO RÉCORD
function saveRecord() {
  const input = document.getElementById("playerName");
  const name = input.value.trim().slice(0, 10);

  if (!name) {
    alert("¡Escribe tu nombre primero!");
    input.focus();
    return;
  }

  let records = getRecords();

  records.push({
    name: name,
    score: score
  });

  records.sort((a, b) => b.score - a.score);
  records = records.slice(0, 5);

  if (storeRecords(records)) {
    renderRecords();

    document.getElementById("recordModal").style.display = "none";

    document.getElementById("message").textContent =
      "🏆 ¡RÉCORD GUARDADO!";

    document.getElementById("startButton").textContent =
      "▶ JUGAR OTRA VEZ";
  }
}

// MOSTRAR RÉCORDS AL ABRIR
renderRecords();
draw();

</script>

</body>
</html>
